name: Newsletter - Robotics Herald
steps:
  - script: gmail-search
    params:
      query: label:newsletters-robotics-herald is:unread -label:processed
      account: jerrymannel@gmail.com
  - agent:
      model: antigravity/gemini-3-8-flash
    instructionsFile: link-summarizer.md
  - agent:
      model: claude-bridge/claude-opus-5
    instructionsFile: reviewer.md
    reviews: 2
    maxRounds: 3
  - agent:
      model: antigravity/gemini-3-8-flash
    instructionsFile: kms-builder.md
  - agent:
      model: claude-bridge/claude-haiku-4-5
    instructionsFile: gmail-processed.md
  - script: clear-downloads
