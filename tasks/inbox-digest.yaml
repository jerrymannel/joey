# The example from docs/redesign.md: fetch unread mail, summarise, review until approved, email the result.
name: Inbox digest
# schedule: "0 8 * * 1-5"   # weekdays at 08:00 — uncomment to run it on a schedule
steps:
  - script: gmail-search
    params: { account: work.jerrymannel@gmail.com, query: "is:unread in:inbox", max: 10 }
  - agent: { model: claude-bridge/claude-sonnet-5 }
    instructions: Read every email listed above and summarise them; highlight what is important.
  - agent: { model: claude-bridge/claude-sonnet-5 }
    instructionsFile: reviewer.md   # reads prompts/reviewer.md; or use an inline `instructions:` — exactly one
    reviews: 2
    maxRounds: 3
  - agent: { model: claude-bridge/claude-sonnet-5 }
    instructions: Make sure everything relevant is captured, then send me the final digest with task_send_result.
