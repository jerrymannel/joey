# How a task step invokes this script (docs/redesign.md). command defaults to app.ts (relative to this folder).
# Joey passes RUN_DIR, TASK_DIR, STEP_INPUT, STEP_OUTPUT and these params as JOEY_PARAMS — see scripts/joey.ts.
description: Move every downloaded video (TASK_DIR/<video id>/video.mp4) to a folder as "<title> [<video id>].mp4" for Plex / Jellyfin, with its poster (.jpg) and English subtitles (.en.srt) beside it; the rest of the download stays. With server, the folder is on that SSH server and the files are uploaded.
params:
  folder: { description: Absolute folder path to move the videos to (on the server, if one is set), required: true }
  server: { description: 'SSH server (Settings → SSH) to upload to, e.g. the Jellyfin box; empty = folder is local', source: ssh-server }
