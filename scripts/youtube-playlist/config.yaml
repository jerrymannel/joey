# How a task step invokes this script (docs/redesign.md). command defaults to app.ts (relative to this folder).
# Joey passes RUN_DIR, TASK_DIR, STEP_INPUT, STEP_OUTPUT and these params as JOEY_PARAMS — see scripts/joey.ts.
description: Download every video of a playlist not yet in the task folder (mp4, audio, subtitles, optional transcript).
params:
  playlistId: { description: YouTube playlist id, required: true }
  account: { description: Connected YouTube account; empty = the first one }
  transcribe: { description: 'Transcribe each download with whisper (default true; "false" to skip)' }
