# How a task step invokes this script (docs/redesign.md). command defaults to app.ts (relative to this folder).
# Joey passes RUN_DIR, TASK_DIR, STEP_INPUT, STEP_OUTPUT and these params as JOEY_PARAMS — see scripts/joey.ts.
description: Save each new email matching a Gmail search to the run folder, one markdown file each (already-processed mail is skipped via gmail.db).
params:
  query: { description: 'Gmail search string, e.g. "is:unread in:inbox"', required: true }
  account: { description: Connected Gmail account to search; empty = the first one }
  max: { description: Total new emails to process; pulled in batches of 10, already-processed ones skipped (default 50) }
