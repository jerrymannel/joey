# Scripts a task step can run (docs/redesign.md). command is relative to this file; .ts runs with tsx.
# Joey passes RUN_DIR, TASK_DIR, STEP_INPUT, STEP_OUTPUT and JOEY_PARAMS (these params, JSON) — see scripts/joey.ts.

gmail-search:
  command: scripts/gmail-search/app.ts
  description: Save every email matching a Gmail search to the run folder, one markdown file each.
  params:
    query: { description: 'Gmail search string, e.g. "is:unread in:inbox"', required: true }
    account: { description: Connected Gmail account to search; empty = the first one }
    max: { description: Most emails to fetch (default 50) }

youtube-playlist:
  command: scripts/youtube-playlist/app.ts
  description: Download every video of a playlist not yet in the task folder (mp4, audio, subtitles, optional transcript).
  params:
    playlistId: { description: YouTube playlist id, required: true }
    account: { description: Connected YouTube account; empty = the first one }
    transcribe: { description: 'Transcribe each download with whisper (default true; "false" to skip)' }

transcribe-folder:
  command: scripts/transcribe-folder/app.ts
  description: Transcribe every audio file under a folder that has no transcript yet, with whisper.
  params:
    folder: { description: Absolute folder path, required: true }
    extensions: { description: 'File extensions to transcribe (default "mp3,wav")' }
